# ============================================================
# Prometheus Configuration — DEMS Grid Simulation
# ============================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'dems-grid'

scrape_configs:
  # DEMS API (FastAPI /metrics endpoint)
  - job_name: 'dems-api'
    static_configs:
      - targets: ['dems-api:8000']
    metrics_path: '/metrics'
    scrape_interval: 5s

  # DEMS Simulation (Prometheus exporter)
  - job_name: 'dems-simulation'
    static_configs:
      - targets: ['dems-simulation:9100']
    scrape_interval: 5s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
