# yaml-language-server: $schema: https://raw.githubusercontent.com/grafana/grafana/main/kinds/datasource/datasource.json#/definitions/DataSourceList

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    jsonData:
      timeInterval: "5s"
      queryTimeout: "60s"
