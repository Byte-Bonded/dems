# Docker Compose for DEMS Monitoring Stack
# Grafana + Prometheus setup for Dynamic Energy Management System
#
# Usage:
#   cd monitoring
#   docker-compose up -d
#
# Access:
#   Grafana:    http://localhost:3000 (admin/dems2024)
#   Prometheus: http://localhost:9090

version: '3.8'

services:
  # ─────────────────────────────────────────────────────────────────────────────
  # Prometheus - Time-series metrics database
  # ─────────────────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: dems-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - dems-network
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────────────────────────────────────────
  # Grafana - Visualization and dashboards
  # ─────────────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.2.0
    container_name: dems-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Security
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=dems2024
      - GF_USERS_ALLOW_SIGN_UP=false
      
      # Server
      - GF_SERVER_ROOT_URL=http://localhost:3000
      - GF_SERVER_SERVE_FROM_SUB_PATH=false
      
      # Paths
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      
      # Plugins
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel,grafana-polystat-panel
      
      # Anonymous access (for quick testing)
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      
      # Default dashboard
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/dems_overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    networks:
      - dems-network
    depends_on:
      prometheus:
        condition: service_healthy

  # ─────────────────────────────────────────────────────────────────────────────
  # Node Exporter - Host machine metrics (optional)
  # ─────────────────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.6.1
    container_name: dems-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - dems-network

  # ─────────────────────────────────────────────────────────────────────────────
  # DEMS Metrics Exporter - Custom metrics from the DEMS application
  # Build from ../src/monitoring/Dockerfile or run separately
  # ─────────────────────────────────────────────────────────────────────────────
  # dems-exporter:
  #   build:
  #     context: ../
  #     dockerfile: monitoring/Dockerfile.exporter
  #   container_name: dems-exporter
  #   restart: unless-stopped
  #   ports:
  #     - "8000:8000"
  #   networks:
  #     - dems-network
  #   extra_hosts:
  #     - "host.docker.internal:host-gateway"

networks:
  dems-network:
    driver: bridge
    name: dems-monitoring

volumes:
  prometheus_data:
    name: dems_prometheus_data
  grafana_data:
    name: dems_grafana_data
