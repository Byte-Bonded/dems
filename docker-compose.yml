# ============================================================
# DEMS — Dynamic Energy Management System
# 117-bus IEEE 39-bus Tri-Area SuperGrid Docker Stack
#
# Services:
#   dems-api         — FastAPI server (grid state, power flow, metrics)
#   dems-simulation  — Headless simulation / RL training
#   prometheus       — Metrics scraping (port 9090)
#   grafana          — Dashboards        (port 3000)
#
# Usage:
#   docker compose up -d                 # start everything
#   docker compose up dems-api           # API only
#   docker compose run dems-simulation   # run simulation tests
#   docker compose run dems-simulation python -c "
#       from src.simulation import GridOrchestrator
#       orch = GridOrchestrator()
#       obs = orch.reset()
#       print('Observation:', obs.shape)
#   "
# ============================================================

services:
  # ─── DEMS API (FastAPI + Grid Simulation) ───────────────
  dems-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: dems-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=9100
    volumes:
      - ./logs:/app/logs
    networks:
      - dems-network
    restart: unless-stopped

  # ─── DEMS Simulation (headless / RL training) ──────────
  dems-simulation:
    build:
      context: .
      dockerfile: docker/Dockerfile.simulation
    container_name: dems-simulation
    ports:
      - "9100:9100"       # Prometheus metrics
    environment:
      - LOG_LEVEL=INFO
      - PROMETHEUS_PORT=9100
    volumes:
      - ./logs:/app/logs
    networks:
      - dems-network

  # ─── Prometheus (metrics collection) ───────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: dems-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - dems-network
    restart: unless-stopped

  # ─── Grafana (dashboards) ──────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: dems-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=dems2024
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./scripts/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./scripts/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - dems-network
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:

networks:
  dems-network:
    driver: bridge
